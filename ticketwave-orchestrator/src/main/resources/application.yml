server:
  port: 8094

spring:
  application:
    name: ticketwave-orchestrator
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

ticketwave:
  saga:
    recovery-enabled: true
    recovery-interval-ms: ${SAGA_RECOVERY_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.ticketwave: DEBUG
